<!doctype html>
<html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Flash-free theme: set data-theme before first paint via inline script
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jjax-theme') || 'dark'
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
            document.documentElement.classList.toggle('dark', t === 'dark')
          }
        } catch (e) {}
      })()
    </script>

    <!--
      PRIMARY META TAGS
      Title, description, canonical, og:*, twitter:*, and JSON-LD are
      injected dynamically per-page by SEOHead.jsx. The shell below is
      a safe fallback only.
    -->
    <title>Jharkhand JobAlert X — Latest Jharkhand Jobs, JPSC, JSSC &amp; Sarkari Naukri 2026</title>
    <meta
      name="description"
      content="Jharkhand JobAlert X — #1 Portal for Jharkhand Jobs &amp; Vacancies 2026. Latest JPSC, JSSC CGL, Jharkhand Police, Rojgar Mela, Admit Cards, Results across all 24 districts."
    />
    <meta
      name="keywords"
      content="Jharkhand Jobs, Jharkhand Vacancies 2026, Jharkhand Sarkari Naukri, JPSC Recruitment, JSSC, Jharkhand Govt Jobs 2026, Rojgar Mela Jharkhand, Jharkhand Police Bharti, JSSC CGL 2026, JECCE Excise Constable, Jharkhand Teacher Vacancy, Ranchi Jobs, Dhanbad Jobs, Jamshedpur Jobs, Bokaro Jobs, Jharkhand Private Jobs, Free Job Alert Jharkhand"
    />

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google9a45015efe9defd8" />
    <meta name="google-site-verification" content="9a45015efe9defd8" />

    <!-- Content-Signal: tells agents how this content may be used -->
    <meta name="content-signal" content="search=yes, ai-train=no">

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3267638418796867"
      crossorigin="anonymous"
    ></script>

    <!-- Fallback canonical (overridden per-page by SEOHead.jsx) -->
    <link rel="canonical" href="https://jharkhand.jobalertx.com/" />

    <!-- Open Graph fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jharkhand JobAlert X" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://jharkhand.jobalertx.com/og-image.png" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jharkhand.jobalertx.com/og-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Theme -->
    <meta name="theme-color" content="#09324A" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Jharkhand JobAlert X Team" />
    <meta name="geo.region" content="IN-JH" />
    <meta name="geo.placename" content="Jharkhand" />
    <meta name="geo.position" content="23.6102;85.2799" />

    <!-- Structured Data: WebSite and Organization with contact info and social profiles -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Jharkhand JobAlert X",
          "alternateName": "Jharkhand Sarkari Naukri Portal",

          "description": "Jharkhand's #1 Free Job Alert Portal for JPSC, JSSC, Sarkari Naukri, Rojgar Mela and Private Jobs 2026",
          "inLanguage": "en-IN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://jharkhand.jobalertx.com/search?q={search_term_string}",
            "query-input": "required name=search_term_string"
          },
          "areaServed": {
            "@type": "State",

          }
        },
        {
          "@type": "Organization",
          "name": "Jharkhand JobAlert X",
          "url": "https://jharkhand.jobalertx.com/",
          "logo": "https://jharkhand.jobalertx.com/favicon.svg",

          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@jobalertx.com",
            "telephone": "+91-8789862771",

          "sameAs": [

    <!-- Links to essential pages -->

    <link rel="prefetch" href="/contact" as="document">
    <link rel="prefetch" href="/privacy" as="document">
    <link rel="prefetch" href="/terms" as="document">

    <!-- Fonts: Inter + JetBrains Mono -->

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
