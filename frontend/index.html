<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      ============================================================
      PRIMARY META TAGS
      NOTE: Title, description, canonical, og:*, twitter:*, and
      JSON-LD are injected dynamically per-page by SEOHead.jsx.
      The shell below provides safe fallback values only.
      ============================================================
    -->
    <title>Jharkhand JobAlert X — Latest JPSC, JSSC, Sarkari Naukri, Govt Jobs Jharkhand 2026</title>
    <meta
      name="description"
      content="Jharkhand JobAlert X — Free Job Alert 2026 for Jharkhand. Get latest JPSC, JSSC, Rojgar Mela, Sarkari Naukri, Private Jobs, Admit Cards, Results, Answer Keys for all Jharkhand government job vacancies 2026."
    />
    <meta name="keywords" content="Jharkhand Sarkari Naukri, JPSC, JSSC, Jharkhand Govt Jobs 2026, Rojgar Mela Jharkhand, Jharkhand Police Jobs, JSSC NTPC, Jharkhand Teacher Jobs" />

    <!--
      IMPORTANT: No hardcoded canonical here.
      Each page sets its own canonical via SEOHead.jsx useEffect.
    -->

    <!-- Open Graph fallback (overridden per-page by SEOHead.jsx) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jharkhand JobAlert X" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://jharkhand.jobalertx.com/og-image.png" />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jharkhand.jobalertx.com/og-image.png" />

    <!-- Robots: allow indexing; per-page noindex is added via SEOHead where needed -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Theme — dark teal brand color -->
    <meta name="theme-color" content="#09324A" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Jharkhand JobAlert X Team" />
    <meta name="geo.region" content="IN-JH" />
    <meta name="geo.placename" content="Jharkhand" />
    <meta name="geo.position" content="23.6102;85.2799" />

    <!-- Structured Data: Region-specific -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Jharkhand JobAlert X",
      "alternateName": "Jharkhand Sarkari Naukri Portal",
      "url": "https://jharkhand.jobalertx.com/",
      "description": "Jharkhand's #1 Free Job Alert Portal for JPSC, JSSC, Sarkari Naukri, Rojgar Mela and Private Jobs 2026",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://jharkhand.jobalertx.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "areaServed": {
        "@type": "State",
        "name": "Jharkhand",
        "addressCountry": "IN"
      }
    }
    </script>

    <!-- Font Performance: DNS prefetch + preconnect for Google Fonts only -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
